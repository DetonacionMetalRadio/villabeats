<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VillaBeats - Radio en Vivo</title>
<link rel="manifest" href="manifest.json">
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{
    font-family:Arial, sans-serif;
    background:radial-gradient(circle at 50% 30%, #2a0a4a 0%, #12002b 50%, #000 100%);
    color:#fff; min-height:100vh;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    text-align:center; padding:20px; overflow:hidden; position:relative;
  }
  /* Destellos */
  .spark{position:absolute; border-radius:50%; background:#fff; opacity:.8; animation:twinkle 2s infinite}
  @keyframes twinkle{0%,100%{transform:scale(.5);opacity:.2}50%{transform:scale(1.4);opacity:1}}
  .spark:nth-child(1){top:12%;left:18%;width:8px;height:8px}
  .spark:nth-child(2){top:20%;right:15%;width:6px;height:6px;animation-delay:.4s}
  .spark:nth-child(3){top:65%;left:12%;width:7px;height:7px;animation-delay:.8s}
  .spark:nth-child(4){top:70%;right:18%;width:9px;height:9px;animation-delay:1.2s}
  .spark:nth-child(5){top:38%;left:8%;width:5px;height:5px;animation-delay:.6s}
  .spark:nth-child(6){top:45%;right:8%;width:5px;height:5px;animation-delay:1s}

  .logo-wrap{position:relative; width:220px; height:220px; margin-bottom:18px; z-index:2}
  .logo-wrap::before{
    content:""; position:absolute; inset:-14px; border-radius:50%;
    background:conic-gradient(from 0deg,#ff00cc,#ffcc00,#00ffcc,#0066ff,#ff00cc);
    animation:spin 4s linear infinite; filter:blur(2px);
  }
  @keyframes spin{to{transform:rotate(360deg)}}
  .logo-wrap img{
    position:relative; width:100%; height:100%; object-fit:cover;
    border-radius:50%; border:5px solid #12002b; background:#000;
  }
  .playing{ animation:pulse 1.2s infinite; }
  @keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.06)}}

  h1{font-size:42px; letter-spacing:3px; z-index:2; text-shadow:0 0 20px #ff00cc}
  h1 span{color:#ffcc00}
  .subtitle{opacity:.85; margin:6px 0 18px; font-size:15px; z-index:2}
  .now-box{
    background:rgba(255,255,255,.12); border:1px solid rgba(255,255,255,.25);
    backdrop-filter:blur(8px); padding:14px 20px; border-radius:16px;
    width:100%; max-width:360px; z-index:2; margin-bottom:20px;
  }
  .now-label{font-size:11px; letter-spacing:2px; color:#ffcc00; text-transform:uppercase}
  #song{font-size:19px; font-weight:bold; margin-top:6px; line-height:1.3}
  #artist{font-size:13px; opacity:.8; margin-top:2px}

  #playBtn{
    background:linear-gradient(90deg,#ff00cc,#ff6600); border:none; color:#fff;
    font-size:19px; font-weight:bold; padding:16px 38px; border-radius:50px;
    cursor:pointer; box-shadow:0 0 30px rgba(255,0,204,.6); z-index:2;
  }
  #playBtn:active{transform:scale(.96)}
  .status{margin-top:14px; font-size:13px; opacity:.7; z-index:2}
  .footer{position:absolute; bottom:14px; font-size:12px; opacity:.5}
</style>
</head>
<body>
  <div class="spark"></div><div class="spark"></div><div class="spark"></div>
  <div class="spark"></div><div class="spark"></div><div class="spark"></div>

  <div class="logo-wrap" id="logoWrap">
    <img src="logo.png" alt="VillaBeats" onerror="this.src='https://villabeats.pages.dev/logo.png'">
  </div>

  <h1>VILLA<span>BEATS</span></h1>
  <p class="subtitle">La radio que te mueve • Villa Nueva, Guatemala</p>

  <div class="now-box">
    <div class="now-label">🔴 Ahora Suena</div>
    <div id="song">Conectando...</div>
    <div id="artist">VillaBeats Radio</div>
  </div>

  <button id="playBtn">▶ ESCUCHAR EN VIVO</button>
  <div class="status" id="status">Tocá play para escuchar</div>
  <div class="footer">© 2026 VillaBeats</div>

  <audio id="audio" preload="none"></audio>

<script>
  // TU STREAM PANEL - YA EN HTTPS
  const STREAM_URL = "https://streampanel.online/8688/stream";
  const META_URL = "https://streampanel.online/8688/status-json.xsl";

  const audio = document.getElementById('audio');
  const btn = document.getElementById('playBtn');
  const songEl = document.getElementById('song');
  const artistEl = document.getElementById('artist');
  const statusEl = document.getElementById('status');
  const logoWrap = document.getElementById('logoWrap');
  let playing = false;

  btn.addEventListener('click', () => {
    if (!playing) {
      audio.src = STREAM_URL + "?t=" + Date.now();
      audio.play().then(() => {
        playing = true;
        btn.textContent = "⏸ PAUSAR";
        logoWrap.classList.add('playing');
        statusEl.textContent = "En vivo • Sonando ahora";
        fetchMeta();
      }).catch(e => {
        statusEl.textContent = "No se pudo conectar, tocá de nuevo";
        console.log(e);
      });
    } else {
      audio.pause();
      audio.src = "";
      playing = false;
      btn.textContent = "▶ ESCUCHAR EN VIVO";
      logoWrap.classList.remove('playing');
      statusEl.textContent = "Pausado";
    }
  });

  async function fetchMeta() {
    try {
      const r = await fetch(META_URL);
      const data = await r.json();
      // Icecast / StreamPanel format
      let title = "";
      try {
        const src = data.icestats.source;
        const s = Array.isArray(src) ? src[0] : src;
        title = s.title || s.server_name || "";
      } catch(e) {}
      if (title && title !== songEl.textContent) {
        if (title.includes(" - ")) {
          const parts = title.split(" - ");
          artistEl.textContent = parts[0];
          songEl.textContent = parts.slice(1).join(" - ");
        } else {
          songEl.textContent = title;
          artistEl.textContent = "VillaBeats Radio";
        }
      }
    } catch(e) {
      console.log("meta error", e);
    }
  }
  setInterval(() => { if (playing) fetchMeta(); }, 10000);
  fetchMeta();
</script>
</body>
</html>
