<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Villa Beats Radio - Villa Nueva</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{background:#0a0a0a;color:#fff;font-family:Arial,sans-serif;min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:clamp(12px,3vw,32px)}
  .wrap{width:100%;max-width:480px;display:flex;flex-direction:column;align-items:center;flex:1;justify-content:center}
  @media(min-width:768px){.wrap{max-width:860px;flex-direction:row;gap:40px}.hero{flex:1}.player-wrap{flex:1}}
  .logo{width:clamp(160px,45vw,280px);height:clamp(160px,45vw,280px);border-radius:50%;background:#FFDD00;color:#000;display:flex;align-items:center;justify-content:center;font-size:clamp(50px,15vw,90px);font-weight:900;border:4px solid #FFDD00;box-shadow:0 0 30px rgba(255,221,0,.5);margin:0 auto}
  h1{font-size:clamp(28px,8vw,44px);text-align:center;margin:14px 0 4px}
  h1 span{color:#FFDD00}
  .slogan{color:#ccc;text-align:center;font-size:clamp(13px,3.5vw,16px);line-height:1.4;margin-bottom:18px}
  .player{background:#161616;width:100%;border-radius:20px;padding:clamp(14px,4vw,22px);border:1px solid #333}
  .cover{width:100%;aspect-ratio:1/1;background:#FFDD00;color:#000;border-radius:15px;display:flex;align-items:center;justify-content:center;font-size:80px;font-weight:900}
  .artista{color:#FFDD00;font-weight:900;font-size:clamp(12px,3.2vw,14px);text-transform:uppercase;margin-top:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .tema{font-size:clamp(17px,5vw,22px);font-weight:700;margin:4px 0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .envivo{color:#25D366;font-size:clamp(11px,3vw,13px);font-weight:700}
  .btn{width:100%;background:#FFDD00;color:#000;border:none;padding:15px;border-radius:50px;font-size:clamp(15px,4.5vw,18px);font-weight:900;margin-top:14px;cursor:pointer;min-height:52px}
  .volumen{width:100%;margin-top:14px;accent-color:#FFDD00}
  .redes{margin-top:18px;display:flex;gap:10px;flex-wrap:wrap;justify-content:center;width:100%}
  .redes a{background:#222;color:#fff;padding:10px 18px;border-radius:50px;text-decoration:none;font-size:14px;font-weight:700;flex:1;text-align:center;min-width:90px}
</style>
</head>
<body>
  <div class="wrap">
    <div class="hero">
      <img src="logo.jpg" style="width:clamp(160px,45vw,280px);height:clamp(160px,45vw,280px);border-radius:50%;object-fit:cover;border:4px solid #FFDD00;box-shadow:0 0 30px rgba(255,221,0,.5);display:block;margin:0 auto;" alt="Villa Beats">
      <h1>VILLA <span>BEATS</span></h1>
      <p class="slogan">Tu voz, tu música, tu ritmo.<br>Desde Villa Nueva, Guatemala</p>
    </div>
    <div class="player-wrap" style="width:100%">
      <div class="player">
        <div class="cover">♫</div>
        <div class="artista" id="artista">VILLA BEATS</div>
        <div class="tema" id="tema">Dale Play para escuchar</div>
        <div class="envivo">● EN VIVO - VILLA NUEVA</div>
        <button class="btn" id="playBtn">▶ ESCUCHAR EN VIVO</button>
        <input type="range" class="volumen" id="vol" min="0" max="100" value="80">
        <audio id="audio" src="https://streampanel.online/8688/stream" preload="none"></audio>
      </div>
      <div class="redes">
        <a href="https://www.facebook.com/" target="_blank">Facebook</a>
        <a href="https://www.tiktok.com/" target="_blank">TikTok</a>
        <a href="https://wa.me/50200000000" target="_blank">WhatsApp</a>
      </div>
    </div>
  </div>

  const btn=document.getElementById('playBtn');
