<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Villa Beats Radio</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#14051f">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Pacifico&family=Poppins:wght@400;700;900&display=swap" rel="stylesheet">
<style>
  *{margin:0;padding:0;box-sizing:border-box;font-family:'Poppins',Arial,sans-serif}
  body{background:#14051f;background:radial-gradient(circle at 50% 0%, #2a0a3a 0%, #14051f 60%, #0a0210 100%);color:#fff;min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:20px 16px 20px;overflow-x:hidden}
  .logo-wrap{width:260px;height:260px;border-radius:50%;padding:5px;background:conic-gradient(from 0deg,#00e5ff,#7b2bff,#ff2b9d,#ff9d00,#00ff88,#00e5ff);box-shadow:0 0 40px rgba(255,43,157,.4);margin-top:10px;overflow:hidden;flex-shrink:0;position:relative}
  .logo-wrap img{width:100%;height:100%;border-radius:50%;object-fit:cover;display:block;background:#000;position:relative;z-index:2}
  #logo-fallback{position:absolute;inset:5px;border-radius:50%;background:radial-gradient(circle,#2a0a3a 0%, #14051f 70%);display:none;align-items:center;justify-content:center;flex-direction:column;z-index:1}
  #logo-fallback b{font-size:90px;font-weight:900;letter-spacing:2px;background:linear-gradient(90deg,#00e5ff,#ff2b9d,#ff9d00);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
  #logo-fallback span{font-size:12px;letter-spacing:4px;color:#FFDD00;font-weight:700;margin-top:-8px}

  h1{font-family:'Bebas Neue',sans-serif;font-size:58px;line-height:1;margin:22px 0 2px;letter-spacing:4px;font-weight:400;text-align:center;text-shadow:0 0 20px rgba(255,43,157,.6)}
  h1 span{color:#FFDD00;text-shadow:0 0 20px rgba(255,221,0,.7)}
  .sub{color:#d5c5e0;font-size:13px;letter-spacing:1.5px;text-transform:uppercase;text-align:center;margin-bottom:20px}

  .marco-player{width:100%;max-width:420px;padding:4px;border-radius:18px;background:conic-gradient(from 0deg,#00e5ff,#7b2bff,#ff2b9d,#ff9d00,#00ff88,#00e5ff);background-size:200% 200%;animation:destello 3s linear infinite;box-shadow:0 0 35px rgba(255,43,157,.55), 0 0 60px rgba(0,229,255,.35);position:relative;z-index:20}
  @keyframes destello{0%{background-position:0% 50%}100%{background-position:200% 50%}}
  .marco-player::before{content:"✦ ✧ ✨ ✦ ✧";position:absolute;top:-18px;left:0;right:0;text-align:center;font-size:18px;letter-spacing:18px;color:#FFDD00;text-shadow:0 0 10px #FFDD00, 0 0 20px #ff2b9d;animation:parpadea 1.2s infinite;pointer-events:none;z-index:3}
  @keyframes parpadea{0%,100%{opacity:1}50%{opacity:.3}}
  .marco-player-inner{background:#161616;border-radius:14px;overflow:hidden;min-height:76px;display:flex;align-items:center;justify-content:center}
  .marco-player-inner > *{position:relative !important;left:auto !important;right:auto !important;top:auto !important;bottom:auto !important;width:100% !important;max-width:100% !important;transform:none !important}

  /* FRASE EN LETRAS BONITAS - COMBINA CON LA APP */
  .frase{margin-top:30px;text-align:center;max-width:420px;width:100%;padding:0 8px}
  .frase-linea1{font-family:'Pacifico',cursive;font-size:30px;line-height:1.2;background:linear-gradient(90deg,#00e5ff,#ff2b9d,#ff9d00,#00ff88,#00e5ff);background-size:200% auto;-webkit-background-clip:text;-webkit-text-fill-color:transparent;animation:brillo 4s linear infinite;filter:drop-shadow(0 0 12px rgba(255,43,157,.6))}
  @keyframes brillo{to{background-position:200% center}}
  .frase-linea2{font-family:'Bebas Neue',sans-serif;font-size:28px;letter-spacing:3px;margin-top:6px;color:#fff;text-shadow:0 0 15px rgba(0,229,255,.7), 0 0 30px rgba(123,43,255,.6)}
  .frase-linea2 span{color:#FFDD00;text-shadow:0 0 15px rgba(255,221,0,.8)}
  .frase-sub{font-size:12px;letter-spacing:2.5px;text-transform:uppercase;color:#d5c5e0;margin-top:8px}
  .frase-divisor{width:70px;height:3px;margin:12px auto 0;border-radius:10px;background:linear-gradient(90deg,#00e5ff,#ff2b9d,#ff9d00);box-shadow:0 0 12px rgba(255,43,157,.8)}

  .historial{width:100%;max-width:420px;margin-top:22px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.15);border-radius:16px;padding:14px}
  .historial-titulo{font-family:'Bebas Neue',sans-serif;display:flex;align-items:center;gap:8px;font-size:19px;letter-spacing:2px;margin-bottom:10px}
  .historial-titulo i{width:8px;height:8px;background:#ff3b30;border-radius:50%;display:inline-block;animation:parpadea 1.2s infinite;box-shadow:0 0 10px #ff3b30}
  .cancion{display:flex;align-items:center;gap:12px;padding:10px 6px;border-bottom:1px solid rgba(255,255,255,.08)}
  .cancion:last-child{border-bottom:none}
  .num{width:28px;height:28px;min-width:28px;border-radius:50%;background:linear-gradient(135deg,#00e5ff,#ff2b9d);color:#fff;font-weight:900;font-size:13px;display:flex;align-items:center;justify-content:center;box-shadow:0 0 10px rgba(255,43,157,.6)}
  .cancion-info{flex:1;min-width:0}
  .cancion-titulo{font-size:14px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .cancion-artista{font-size:12px;color:#cbbfd6;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .cancion-hora{font-size:11px;color:#8a7a99;white-space:nowrap}
  .sonando-ahora{color:#00ff88;font-size:11px;font-weight:700}
  .footer{margin-top:auto;padding:25px 0 8px;color:#5a4a66;font-size:12px;text-align:center;letter-spacing:1px}
</style>
</head>
<body>

  <div class="logo-wrap" id="mi-logo">
    <img src="logo.png?v=18" alt="Villa Beats" onerror="this.style.display='none';document.getElementById('logo-fallback').style.display='flex'">
    <div id="logo-fallback"><b>VB</b><span>VILLA BEATS</span></div>
  </div>

  <h1>VILLA<span>BEATS</span></h1>
  <p class="sub">La radio que te mueve • Villa Nueva, Guatemala</p>

  <div class="marco-player">
    <div class="marco-player-inner" id="destino-barra">
      <script src="https://sonocaster.com/recursos/widget.js" data-radio="villa-beats" data-tipo="barra" async></script>
    </div>
  </div>

  <!-- FRASE EN LETRAS BONITAS -->
  <div class="frase">
    <div class="frase-linea1">Tu voz, tu espacio, tu ritmo.</div>
    <div class="frase-linea2">LA MÚSICA QUE <span>TE MUEVE</span></div>
    <div class="frase-sub">Villa Nueva • Guatemala • 24/7 Contigo</div>
    <div class="frase-divisor"></div>
  </div>

  <div class="historial">
    <div class="historial-titulo"><i></i> ÚLTIMAS 5 CANCIONES QUE SONARON</div>
    <div id="lista-historial"></div>
  </div>

  <div class="footer">© 2026 VillaBeats</div>

<script>
  const destino = document.getElementById('destino-barra');
  const logo = document.getElementById('mi-logo');
  function subirBarra(){
    const hijos = Array.from(document.body.children);
    for(const el of hijos){
      if(el === logo) continue;
      if(el.classList.contains('marco-player')) continue;
      if(el.tagName === 'SCRIPT') continue;
      if(el.contains(logo) || el.contains(destino)) continue;
      const cs = window.getComputedStyle(el);
      if(cs.position === 'fixed'){
        el.style.setProperty('position','relative','important');
        el.style.setProperty('bottom','auto','important');
        el.style.setProperty('left','auto','important');
        el.style.setProperty('right','auto','important');
        el.style.setProperty('top','auto','important');
        el.style.setProperty('width','100%','important');
        el.style.setProperty('transform','none','important');
        destino.appendChild(el);
        return true;
      }
    }
    return false;
  }
  const timer = setInterval(()=>{ if(subirBarra()) clearInterval(timer); }, 400);
  setTimeout(()=> clearInterval(timer), 12000);

  const listaEl = document.getElementById('lista-historial');
  let historial = JSON.parse(localStorage.getItem('vb-historial') || '[]');
  function pintarHistorial(){
    if(historial.length === 0){
      listaEl.innerHTML = '<div class="cancion"><div class="num">♪</div><div class="cancion-info"><div class="cancion-titulo">Esperando la primera canción...</div><div class="cancion-artista">Dale play arriba y aquí van a salir las últimas 5</div></div></div>';
      return;
    }
    listaEl.innerHTML = historial.map((c, i) => `
      <div class="cancion">
        <div class="num">${i+1}</div>
        <div class="cancion-info">
          <div class="cancion-titulo">${c.titulo}</div>
          <div class="cancion-artista">${c.artista}</div>
        </div>
        <div style="text-align:right">
          <div class="cancion-hora">${c.hora}</div>
          ${i===0 ? '<div class="sonando-ahora">● SONANDO</div>' : ''}
        </div>
      </div>
    `).join('');
  }
  function agregarCancion(tituloCompleto){
    if(!tituloCompleto || tituloCompleto.length < 3) return;
    if(tituloCompleto.toLowerCase().includes('villa beats')) return;
    let titulo = tituloCompleto, artista = 'Villa Beats';
    if(tituloCompleto.includes(' - ')){
      const partes = tituloCompleto.split(' - ');
      artista = partes[0].trim();
      titulo = partes.slice(1).join(' - ').trim();
    }
    if(historial[0] && historial[0].titulo === titulo && historial[0].artista === artista) return;
    const ahora = new Date();
    const hora = ahora.toLocaleTimeString('es-GT', {hour:'2-digit', minute:'2-digit'});
    historial.unshift({titulo, artista, hora});
    historial = historial.slice(0, 5);
    localStorage.setItem('vb-historial', JSON.stringify(historial));
    pintarHistorial();
  }
  function leerDelWidget(){
    const posible = document.querySelector('#destino-barra');
    if(posible){
      const t = posible.innerText || '';
      if(t.includes(' - ') && t.length < 120){
        const lineas = t.split('\n').filter(l => l.includes(' - '));
        if(lineas[0]) agregarCancion(lineas[0].trim());
      }
    }
  }
  async function leerDeStream(){
    try{
      const res = await fetch('https://streampanel.online/8688/status-json.xsl');
      const data = await res.json();
      let titulo = data.icestats?.source?.title || data.icestats?.source?.[0]?.title || '';
      if(titulo) agregarCancion(titulo);
    }catch(e){}
  }
  pintarHistorial();
  setInterval(()=>{ leerDelWidget(); leerDeStream(); }, 8000);
  setTimeout(()=>{ leerDelWidget(); leerDeStream(); }, 3000);
  if('serviceWorker' in navigator){ navigator.serviceWorker.register('sw.js?v=18').catch(()=>{}); }
</script>
</body>
</html>
