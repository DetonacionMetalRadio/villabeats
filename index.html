<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Villa Beats Radio</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#14051f">
<style>
  *{margin:0;padding:0;box-sizing:border-box;font-family:Arial,sans-serif}
  body{background:#14051f;background:radial-gradient(circle at 50% 0%, #2a0a3a 0%, #14051f 60%, #0a0210 100%);color:#fff;min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:20px 16px 90px}
  .logo-wrap{width:260px;height:260px;border-radius:50%;padding:5px;background:conic-gradient(from 0deg,#00e5ff,#7b2bff,#ff2b9d,#ff9d00,#00ff88,#00e5ff);box-shadow:0 0 40px rgba(255,43,157,.4);margin-top:25px;overflow:hidden;flex-shrink:0;position:relative}
  .logo-wrap img{width:100%;height:100%;border-radius:50%;object-fit:cover;display:block;background:#000;position:relative;z-index:2}
  #logo-fallback{position:absolute;inset:5px;border-radius:50%;background:radial-gradient(circle,#2a0a3a 0%, #14051f 70%);display:none;align-items:center;justify-content:center;flex-direction:column;z-index:1}
  #logo-fallback b{font-size:90px;font-weight:900;letter-spacing:2px;background:linear-gradient(90deg,#00e5ff,#ff2b9d,#ff9d00);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
  #logo-fallback span{font-size:12px;letter-spacing:4px;color:#FFDD00;font-weight:700;margin-top:-8px}
  h1{font-size:44px;margin:22px 0 2px;letter-spacing:2px;font-weight:900;text-align:center}
  h1 span{color:#FFDD00}
  .sub{color:#d5c5e0;font-size:14px;text-align:center;margin-bottom:22px}
  .vivo-box{width:100%;max-width:420px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.18);border-radius:16px;padding:18px 14px;text-align:center}
  .en-vivo{color:#FFDD00;font-size:12px;letter-spacing:4px;font-weight:700;display:flex;align-items:center;justify-content:center;gap:8px}
  .en-vivo i{width:12px;height:12px;background:#ff3b30;border-radius:50%;display:inline-block;animation:parpadea 1.2s infinite}
  @keyframes parpadea{0%,100%{opacity:1}50%{opacity:.3}}
  .radio-nombre{font-size:22px;font-weight:700;margin-top:8px}
  .sonando{color:#cbbfd6;font-size:14px;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .aviso{color:#9d8cae;font-size:13px;margin-top:18px;text-align:center}
  .footer{margin-top:auto;padding:25px 0 8px;color:#5a4a66;font-size:12px}
</style>
</head>
<body>

  <div class="logo-wrap">
    <img src="logo.png?v=10" alt="Villa Beats" onerror="this.style.display='none';document.getElementById('logo-fallback').style.display='flex'">
    <div id="logo-fallback"><b>VB</b><span>VILLA BEATS</span></div>
  </div>

  <h1>VILLA<span>BEATS</span></h1>
  <p class="sub">La radio que te mueve • Villa Nueva, Guatemala</p>

  <div class="vivo-box">
    <div class="en-vivo"><i></i> EN VIVO</div>
    <div class="radio-nombre">VillaBeats Radio</div>
    <div class="sonando">Sonando ahora • Villa Nueva</div>
  </div>

  <p class="aviso">Dale play a la barra de abajo 👇<br>Suena aquí mismo, no te saca</p>

  <div class="footer">© 2026 VillaBeats</div>

  <!-- BARRA OFICIAL SONOCASTER -->
  <div data-radio="villa-beats" data-tipo="barra"></div>
  <script src="https://sonocaster.com/recursos/widget.js" async></script>

<script>
  if('serviceWorker' in navigator){ navigator.serviceWorker.register('sw.js?v=10').catch(()=>{}); }
</script>
</body>
</html>
